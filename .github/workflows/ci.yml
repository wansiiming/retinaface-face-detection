name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff numpy

      - name: 代码风格检查
        run: ruff check --select E,F --ignore E501 anchors.py tests

      - name: Anchor 生成器单元测试
        run: pytest -q tests
